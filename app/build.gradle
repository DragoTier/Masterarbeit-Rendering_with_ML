apply plugin: 'com.android.application'
apply plugin: 'de.undercouch.download'


android {
    compileSdk 32
    ndkVersion '23.1.7779620'
    
    defaultConfig {
        applicationId 'de.esolutions.masterthesis.aiupscale'
        minSdkVersion 29
        targetSdkVersion 32
        externalNativeBuild {
            cmake {
                // Available arguments are inside ${SDK}/cmake/.../android.toolchain.cmake file
                version "3.18.1"
                arguments '-DANDROID_STL=c++_static', '-DASSIMP_ANDROID_JNIIOSYSTEM=ON', '-DCMAKE_TOOLCHAIN_FILE=C:/Users/ivmu6294/AppData/Local/Android/Sdk/ndk/23.1.7779620/build/cmake/android.toolchain.cmake'
                //arguments '-GAndroid Gradle - Ninja'
                //path 'src/main/cpp/CMakeLists.txt'
            }
        }
         ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                        'proguard-rules.pro'
            signingConfig signingConfigs.debug
            debuggable true

        }
        debug {
            debuggable true
            jniDebuggable true
            packagingOptions { doNotStrip "**//.so" }
        }
    }
    aaptOptions {
        noCompress "tflite"
    }

    externalNativeBuild {
        cmake {
            version '3.18.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
apply from: 'download.gradle'

dependencies {
    implementation 'com.google.guava:guava:30.0-android'
    implementation "androidx.appcompat:appcompat:1.4.1"

}

