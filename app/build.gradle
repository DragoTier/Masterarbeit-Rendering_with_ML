apply plugin: 'com.android.application'
apply plugin: 'de.undercouch.download'


android {
    compileSdk 30
    ndkVersion '23.1.7779620'
    
    defaultConfig {
        applicationId 'com.android.gl2jni'
        minSdkVersion 29
        targetSdkVersion 30
        externalNativeBuild {
            cmake {
                // Available arguments are inside ${SDK}/cmake/.../android.toolchain.cmake file
                version "3.18.1"
                arguments '-DANDROID_STL=c++_static'
                //arguments '-GAndroid Gradle - Ninja'
            }
        }
         ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                        'proguard-rules.pro'
            signingConfig signingConfigs.debug
            debuggable true

        }
        debug {
            debuggable true
            jniDebuggable true
            packagingOptions { doNotStrip "**//.so" }
        }
    }
    aaptOptions {
        noCompress "tflite"
    }

    sourceSets {
        main {
            // let gradle pack the shared library into apk
            //jniLibs.srcDirs = ['../libraries/tensorflowlite/jni',
           //                    '../libraries/tensorflowlite-gpu/jni']
        }
    }

    externalNativeBuild {
        cmake {
            version '3.18.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    //buildToolsVersion '30.0.3'

    //dependencies {
    //    implementation 'org.tensorflow:tensorflow-lite:2.6.0'
    //
    //}
}

project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
apply from: 'download.gradle'

dependencies {
    //implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.guava:guava:30.0-android'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    //implementation 'com.android.support:design:23.0.1'
}

